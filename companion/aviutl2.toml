#:schema ./.aviutl2-cli/aviutl2.schema.json
# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。

[project]
id = "aviutl2-community.aviutl2_community_translation_companion"
name = "aviutl2_community_translation_companion"
version = "0.1.0"

[development]
aviutl2_version = "latest"
catalog_dependencies = ["sevenc-nanashi.quantizer-aux2"]

[release]
prebuild = ["cargo about generate ./about.hbs -o ./release/package.txt"]
package_template = "./release/package.txt"

[artifacts.aviutl2_community_translation_companion-aux2]
destination = "Plugin/aviutl2_community_translation_companion.aux2"

[artifacts.aviutl2_community_translation_companion-aux2.profiles.debug]
build = "cargo build"
source = "../target/debug/aviutl2_community_translation_companion.dll"

[artifacts.aviutl2_community_translation_companion-aux2.profiles.release]
build = "cargo build --release"
source = "../target/release/aviutl2_community_translation_companion.dll"

