[package]
name = "aviutl2-community-translation-companion"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
aviutl2 = "0.33.0"
native-dialog = "0.9.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
ureq = "3.3.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
